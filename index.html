<meta charset="utf-8">
<title>Grandma vs. AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Orbitron:wght@600;800&display=swap">
<style>
/* Layout: one fixed 1600x900 storybook stage, scaled to fit and letterboxed; all UI lives inside the stage. Single warm look by design. */
:root{
  --sand:#F5E6C8; --sand-deep:#E9D2A6; --brown:#7B5036; --brown-dark:#4A2E1E;
  --teal:#168B91; --teal-dark:#0D3B44; --glow:#6FF3EC;
  --gold:#F2BC58; --lavender:#A99BE8; --coral:#F49B82; --ink:#2A1B12; --cream:#FFF8EA;
  --letterbox:#24160E;
  --f-display:"Baloo Bhaijaan 2","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-robot:"Orbitron","Baloo Bhaijaan 2",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--letterbox);color:var(--ink);font-family:var(--f-display);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--sand);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.layer{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
.actor{position:absolute;left:0;top:0;transform-origin:50% 100%;transition:transform 1s cubic-bezier(.45,.05,.3,1),opacity .6s;will-change:transform}
.actor svg{display:block;width:100%;height:auto;overflow:visible}
.actor.flip svg{transform:scaleX(-1)}
.actor.speaking{filter:drop-shadow(0 0 16px rgba(255,236,170,.9))}
.actor.hidden{opacity:0;pointer-events:none}

/* idle motion */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes flame{0%,100%{transform:scaleY(1);opacity:.85}50%{transform:scaleY(.7);opacity:.5}}
@keyframes armL{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes armR{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-55deg)}50%{transform:rotate(-35deg)}75%{transform:rotate(-55deg)}}
@keyframes talk{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
@keyframes chest{0%,100%{opacity:1}50%{opacity:.65}}
.rb-float{animation:bob 2.6s ease-in-out infinite}
.rb-flame{transform-origin:110px 238px;animation:flame .25s infinite}
.rb-armL{transform-origin:38px 160px;animation:armL 2.6s ease-in-out infinite}
.rb-armR{transform-origin:182px 160px;animation:armR 2.6s ease-in-out infinite}
.rb-chest{animation:chest 1.6s ease-in-out infinite}
.rb-eyes{transition:transform .4s}
.em{display:none}
.robo[data-eyes="normal"] .em-normal,.robo[data-eyes="happy"] .em-happy,.robo[data-eyes="bolt"] .em-bolt,
.robo[data-eyes="q"] .em-q,.robo[data-eyes="heart"] .em-heart,.robo[data-eyes="alarm"] .em-alarm,.robo[data-eyes="soft"] .em-soft{display:inline}
.robo .em-normal rect,.robo .em-soft rect{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.robo .gold{opacity:var(--goldness,.35);transition:opacity 1.2s}
.robo .rb-heart,.robo .rb-emblem{opacity:0;transition:opacity .8s}
.robo.has-heart .rb-heart{opacity:1}
.robo.guardian .rb-emblem{opacity:1}
.robo.guardian .rb-heart{opacity:0}
.robo.alarm .rb-chest{fill:#ff5a5a}
.mouth-open{transform-box:fill-box;transform-origin:center top;opacity:0}
.talking .mouth-open{opacity:1;animation:talk .16s ease-in-out infinite alternate}
.talking .mouth-closed{opacity:0}
.gm-eyes,.sis-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.sis-eyes.b{animation-duration:4.4s;animation-delay:1.3s}
.gm-body,.sis-body{transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.gm-brow{transition:transform .3s}
.raise .gm-brow{transform:translateY(-6px)}
.sis-armR{transform-box:fill-box;transform-origin:20% 8%}
.waving .sis-armR{animation:wave 1.2s ease-in-out 2}
.cheer .sis-armR,.cheer .sis-armL{animation:wave .7s ease-in-out infinite}
.sis-armL{transform-box:fill-box;transform-origin:80% 8%}
.cheer .sis-armL{animation-direction:reverse}
.album{opacity:0;transition:opacity .5s}
.holding .album{opacity:1}
.sweat{opacity:0;transition:opacity .4s}
.hot .sweat{opacity:1}

/* holo panel above ROBO */
.holo{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);min-width:330px;padding:12px 18px;border-radius:14px;
  background:linear-gradient(160deg,rgba(111,243,236,.22),rgba(169,155,232,.25));border:2px solid rgba(111,243,236,.8);
  color:#E9FFFD;font-family:var(--f-robot);font-size:19px;letter-spacing:.06em;box-shadow:0 0 24px rgba(111,243,236,.5);
  backdrop-filter:blur(2px);opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.holo.on{opacity:1}
.holo .row{display:flex;justify-content:space-between;gap:16px;align-items:center}
.holo .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);margin:4px 0 8px;overflow:hidden}
.holo .bar i{display:block;height:100%;width:0;background:var(--glow);transition:width 1.2s}
.holo .bar.u i{background:linear-gradient(90deg,var(--gold),#ffe7a6)}
.holo.glitch .uval{animation:glitch .18s steps(2) infinite}
@keyframes glitch{0%{transform:translate(2px,0);color:#ff7d9c}100%{transform:translate(-2px,1px);color:#7ff}}
.crown{position:absolute;left:50%;top:-58px;width:110px;transform:translateX(-50%) scale(.2);opacity:0;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.crown.on{opacity:.9;transform:translateX(-50%) scale(1)}

/* scene props */
.prop{position:absolute;transition:transform .8s,opacity .6s}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:40}
.hud-btns{position:absolute;top:22px;left:24px;display:flex;gap:12px;pointer-events:auto}
.hbtn{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(42,27,18,.55);color:#fff;display:grid;place-items:center;cursor:pointer;font-family:var(--f-robot);font-size:15px;font-weight:800;backdrop-filter:blur(4px);transition:transform .15s}
.hbtn:hover{transform:scale(1.08)}
.hbtn:active{transform:scale(.94)}
.hbtn:focus-visible,.btn:focus-visible,.card:focus-visible{outline:5px solid var(--glow);outline-offset:4px}
.hbtn svg{width:30px;height:30px}
.hbtn.wide{width:auto;padding:0 18px;border-radius:32px}
#memories{position:absolute;top:22px;right:26px;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 22px;border-radius:40px;background:rgba(42,27,18,.55);border:3px solid rgba(255,255,255,.85);color:#fff;font-size:22px;font-weight:700;opacity:0;transition:opacity .5s}
#memories.on{opacity:1}
.slot{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;border:2px dashed rgba(255,255,255,.5);transition:all .5s}
.slot svg{width:28px;height:28px;opacity:0;transform:scale(.2);transition:all .6s cubic-bezier(.3,1.7,.5,1)}
.slot.full{border-style:solid;border-color:var(--gold);background:rgba(242,188,88,.25);box-shadow:0 0 18px rgba(242,188,88,.7)}
.slot.full svg{opacity:1;transform:scale(1)}

/* subtitles */
#subs{position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);width:min(1180px,92%);z-index:45;
  background:rgba(255,248,234,.96);border-radius:26px;padding:18px 34px 20px;box-shadow:0 14px 40px rgba(0,0,0,.35);border:4px solid var(--gold);
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
#subs.on{opacity:1;transform:translateX(-50%) translateY(0)}
#subs .who{position:absolute;top:-24px;left:34px;padding:4px 20px;border-radius:20px;color:#fff;font-weight:800;font-size:22px;background:var(--teal)}
#subs .ar{direction:rtl;font-size:37px;line-height:1.35;font-weight:700;color:var(--ink);text-wrap:balance}
#subs .en{font-size:25px;line-height:1.3;color:#6A4A33;margin-top:4px;text-wrap:balance}
#subs.mode-ar .en,#subs.mode-en .ar{display:none}
#subs.mode-en .en{font-size:34px;color:var(--ink);font-weight:600}
#subs.mode-off{visibility:hidden}

/* interaction overlay */
#ui{position:absolute;inset:0;z-index:30;pointer-events:none}
#ui > *{pointer-events:auto}
.prompt{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:var(--teal);color:#fff;border-radius:30px;padding:10px 34px 12px;text-align:center;box-shadow:0 10px 30px rgba(13,59,68,.4);border:4px solid #fff;max-width:1100px}
.prompt .ar{direction:rtl;font-size:38px;font-weight:800;line-height:1.3}
.prompt .en{font-size:25px;opacity:.92;font-weight:600}
.cards{position:absolute;left:50%;top:250px;transform:translateX(-50%);display:flex;gap:34px}
.card{width:330px;border-radius:28px;background:var(--cream);border:5px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.25);cursor:pointer;padding:14px 14px 16px;text-align:center;transition:transform .2s,box-shadow .2s;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;font-family:var(--f-display);color:var(--ink)}
.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
.card:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.card svg{width:100%;height:auto;display:block;border-radius:18px}
.card .ar{direction:rtl;font-size:30px;font-weight:800;margin-top:8px;line-height:1.2}
.card .en{font-size:21px;color:#7A5A40;font-weight:600}
.card.shake{animation:shake .5s}
.card.hint{box-shadow:0 0 0 8px var(--gold),0 0 40px var(--gold);animation:pulse 1s infinite}
.card.right{border-color:#7BD389;box-shadow:0 0 0 8px #7BD389,0 0 50px #7BD389}
.card.dim{opacity:.35;transform:scale(.94);pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(40px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-18px) rotate(-3deg)}40%{transform:translateX(16px) rotate(2deg)}60%{transform:translateX(-10px)}80%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.04)}}

.btn{font-family:var(--f-display);font-weight:800;border:none;cursor:pointer;border-radius:50px;color:#fff;background:linear-gradient(180deg,#22A9AF,var(--teal));box-shadow:0 8px 0 #0B5E62,0 16px 30px rgba(0,0,0,.3);padding:14px 44px 16px;font-size:34px;transition:transform .12s,box-shadow .12s;display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.btn small{font-size:22px;font-weight:600;opacity:.9}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #0B5E62,0 6px 14px rgba(0,0,0,.3)}
.btn.gold{background:linear-gradient(180deg,#FFD47E,var(--gold));color:var(--brown-dark);box-shadow:0 8px 0 #B5822A,0 16px 30px rgba(0,0,0,.3)}
.btn.coral{background:linear-gradient(180deg,#FFB39E,#E9775C);box-shadow:0 8px 0 #A54A33,0 16px 30px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.18);box-shadow:none;border:3px solid rgba(255,255,255,.8);font-size:24px;padding:8px 26px 10px}

/* title */
#title{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;padding-top:70px;pointer-events:none}
#title > *{pointer-events:auto}
.logo{text-align:center;color:#fff;text-shadow:0 6px 0 var(--brown-dark),0 12px 30px rgba(0,0,0,.4);animation:pop .9s cubic-bezier(.3,1.5,.5,1) both}
.logo .l1{font-size:120px;font-weight:800;line-height:.95;letter-spacing:.01em}
.logo .l1 .vs{color:var(--gold);font-size:80px;vertical-align:middle;margin:0 10px}
.logo .l1 .ai{font-family:var(--f-robot);color:var(--glow);text-shadow:0 6px 0 var(--teal-dark),0 0 30px var(--glow)}
.logo .l2{font-size:44px;font-weight:700;color:var(--cream);margin-top:6px}
.logo .l3{direction:rtl;font-size:52px;font-weight:800;color:var(--gold);margin-top:2px}
.tagline{margin-top:10px;font-size:28px;color:#fff;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.6);text-align:center}
.tagline b{direction:rtl;display:block;font-size:34px}
#startBtn{margin-top:26px;animation:pop .8s .4s cubic-bezier(.3,1.5,.5,1) both, pulse 1.6s 1.4s infinite}
.title-links{margin-top:22px;display:flex;gap:14px}
.yof{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;font-weight:700;background:rgba(42,27,18,.5);padding:6px 22px;border-radius:30px;white-space:nowrap}
.loadbar{width:260px;height:8px;border-radius:6px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}

/* panels */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--cream);border-radius:30px;border:5px solid var(--gold);padding:34px 44px;box-shadow:0 30px 80px rgba(0,0,0,.5);z-index:60;min-width:640px;text-align:center}
.panel h2{margin:0 0 6px;font-size:44px;color:var(--brown-dark);text-wrap:balance}
.panel p{font-size:24px;color:#6A4A33;margin:6px 0 18px}
.field{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:12px 0;text-align:left}
.field label{font-size:22px;font-weight:700;color:var(--brown)}
.field input{font:inherit;font-size:28px;padding:10px 18px;border-radius:16px;border:3px solid var(--sand-deep);background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
.field input:focus{outline:none;border-color:var(--teal)}
.row-btns{display:flex;gap:18px;justify-content:center;margin-top:20px;flex-wrap:wrap}

/* banners */
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:50;text-align:center;pointer-events:none;animation:bannerIn 2.8s ease both}
.banner .orb{width:170px;height:170px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff,var(--c) 60%);box-shadow:0 0 60px var(--c),0 0 120px var(--c)}
.banner .orb svg{width:90px;height:90px}
.banner .t1{font-family:var(--f-robot);font-size:30px;color:#fff;letter-spacing:.1em;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.banner .t2{font-size:58px;font-weight:800;color:var(--gold);text-shadow:0 5px 0 var(--brown-dark),0 0 30px rgba(0,0,0,.4)}
.banner .t3{direction:rtl;font-size:44px;font-weight:800;color:#fff;text-shadow:0 4px 0 var(--brown-dark)}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.6)}}

/* map */
.mapnode{position:absolute;width:210px;text-align:center;cursor:pointer;border:none;background:none;font-family:var(--f-display);transform:translate(-50%,-50%);transition:transform .2s}
.mapnode .disc{width:170px;height:170px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff 0,var(--c) 70%);border:6px solid #fff;box-shadow:0 0 40px var(--c);transition:all .3s}
.mapnode .disc svg{width:100px;height:100px}
.mapnode .lbl{margin-top:10px;color:#fff;font-weight:800;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.4);line-height:1.15}
.mapnode .lbl span{display:block;direction:rtl;font-size:32px}
.mapnode.locked{cursor:default}
.mapnode.locked .disc{filter:grayscale(1) brightness(.6);box-shadow:none}
.mapnode.next .disc{animation:pulse 1.2s infinite;box-shadow:0 0 70px var(--c),0 0 0 10px rgba(255,255,255,.35)}
.mapnode.done .disc{filter:none;box-shadow:0 0 30px var(--gold);border-color:var(--gold)}
.mapnode .check{position:absolute;right:16px;top:-4px;width:56px;height:56px;border-radius:50%;background:var(--gold);display:none;place-items:center;border:4px solid #fff}
.mapnode.done .check{display:grid}
.mapnode .lock{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:54px;display:none}
.mapnode.locked .lock{display:block}
.mapnode .lock svg{width:100%;height:auto;display:block}

/* drag */
#dragHandle{position:absolute;border-radius:50%;border:5px dashed rgba(255,255,255,.95);background:rgba(242,188,88,.18);cursor:grab;touch-action:none;animation:pulse 1.2s infinite;z-index:31}
#dragHandle:active{cursor:grabbing}
.ghost-hand{position:absolute;width:90px;z-index:32;pointer-events:none;animation:ghost 2.4s ease-in-out infinite}
@keyframes ghost{0%{transform:translate(0,0);opacity:0}15%{opacity:1}70%{transform:translate(560px,0);opacity:1}100%{transform:translate(560px,0);opacity:0}}

/* album */
#album{position:absolute;left:50%;top:46%;width:820px;transform:translate(-50%,-50%) scale(.3);opacity:0;transition:all .8s cubic-bezier(.3,1.3,.5,1);z-index:20;pointer-events:none}
#album.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#album svg{width:100%;height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.twinkle{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}

/* tints */
#tint{position:absolute;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .6s}
#tint.alarm{background:radial-gradient(circle,transparent 40%,rgba(255,40,60,.45));opacity:1;animation:alarm .6s infinite alternate}
@keyframes alarm{to{opacity:.35}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:55}
#flash.go{animation:flash 1.4s ease}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#iris{position:absolute;inset:0;z-index:70;pointer-events:none;background:var(--letterbox);clip-path:circle(150% at 50% 50%);transition:clip-path .7s cubic-bezier(.6,0,.4,1)}
#iris.open{clip-path:circle(0% at 50% 50%)}
#iris.closed{clip-path:circle(150% at 50% 50%)}
/* iris uses inverse: we draw a ring by mask */
#iris{-webkit-mask:radial-gradient(circle at 50% 50%,transparent var(--r,0px),#000 calc(var(--r,0px) + 2px));mask:radial-gradient(circle at 50% 50%,transparent var(--r,0px),#000 calc(var(--r,0px) + 2px));clip-path:none;transition:none}

#confetti{position:absolute;inset:0;pointer-events:none;z-index:52}
.orbit{position:absolute;width:0;height:0;z-index:15}
.orbit .o{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff,var(--c) 65%);box-shadow:0 0 40px var(--c);transition:transform 1.2s cubic-bezier(.6,0,.4,1),opacity 1s}
.orbit .o svg{width:58px;height:58px}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin .o > svg{animation:spin 6s linear infinite reverse}
.tag{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--f-robot);font-weight:800;font-size:34px;padding:10px 30px;border-radius:16px;letter-spacing:.06em;white-space:nowrap;transition:all .6s;z-index:21}
.tag.old{background:rgba(13,59,68,.8);color:var(--glow);border:3px solid var(--glow)}
.tag.new{background:linear-gradient(180deg,#FFE29C,var(--gold));color:var(--brown-dark);border:3px solid #fff;box-shadow:0 0 40px var(--gold)}
.tag .sub{display:block;font-family:var(--f-display);font-size:28px;direction:rtl;letter-spacing:0}
.finale-msg{position:absolute;left:50%;top:74px;transform:translateX(-50%);text-align:center;width:1300px;z-index:22}
.finale-msg .m1{font-size:62px;font-weight:800;color:#fff;line-height:1.05;text-shadow:0 5px 0 var(--brown-dark),0 10px 30px rgba(0,0,0,.35);text-wrap:balance}
.finale-msg .m2{direction:rtl;font-size:54px;font-weight:800;color:var(--gold);text-shadow:0 4px 0 var(--brown-dark)}
.finale-msg .m3{margin-top:8px;display:inline-block;background:rgba(255,248,234,.92);color:var(--brown-dark);border-radius:30px;padding:6px 28px;font-size:26px;font-weight:700}
.finale-msg .m3 span{direction:rtl;display:block;font-size:28px}
.fadein{animation:fadein 1.2s both}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%)}}

#cert img{width:680px;max-width:100%;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:block;margin:0 auto;-webkit-touch-callout:default;user-select:auto}

function sparkleAt(x,y,n=10,color){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='sparkle';const a=Math.random()*Math.PI*2,r=40+Math.random()*80;s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');if(color)s.style.background=`radial-gradient(circle,#fff,${color} 60%,transparent 70%)`;stage.appendChild(s);setTimeout(()=>s.remove(),750)}}
function toStage(e){const r=stage.getBoundingClientRect();const s=stageScale();return{x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s}}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,.card,#dragHandle')){const p=toStage(e);sparkleAt(p.x,p.y,8)}},true);
function cardsChoice(opts,correct,onWrong){const r=RUN;return new Promise(res=>{const wrap=document.createElement('div');wrap.className='cards';ui.appendChild(wrap);let wrongs=0,busy=false;
 opts.forEach(o=>{const b=document.createElement('button');b.className='card';b.type='button';b.innerHTML=`${o.art}<div class="ar">${o.ar}</div><div class="en">${o.en}</div>`;b.onclick=async()=>{if(busy||r!==RUN)return;sfx.tap();
   if(correct==null||o.k===correct){busy=true;b.classList.add('right');wrap.querySelectorAll('.card').forEach(c=>c!==b&&c.classList.add('dim'));sfx.correct();await wait(700).catch(()=>{});res(o.k)}
   else{busy=true;wrongs++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');sfx.wrong();try{await onWrong(o.k,wrongs)}catch(e){return}busy=false;if(wrongs>=2)wrap.querySelectorAll('.card').forEach(c=>{if(c.dataset.k===correct)c.classList.add('hint')})}};
  b.dataset.k=o.k;wrap.appendChild(b)});wrap.querySelector('.card').focus({preventScroll:true})})}

 guard(r);await fn();await wait(120);for(let i=0;i<=steps;i++){el.style.setProperty('--r',(R*i/steps)+'px');await new Promise(q=>requestAnimationFrame(q))}}

/* ================= CONFETTI ================= */
const cv=$('#confetti'),cx=cv.getContext('2d');let confetti=[],confOn=false;
function burst(n=160){for(let i=0;i<n;i++)confetti.push({x:800+(Math.random()-.5)*400,y:420,vx:(Math.random()-.5)*22,vy:-Math.random()*20-6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:['#F2BC58','#6FF3EC','#F49B82','#A99BE8','#7BC47F','#fff'][i%6],w:10+Math.random()*10,h:6+Math.random()*8});if(!confOn){confOn=true;requestAnimationFrame(cstep)}}
function cstep(){cx.clearRect(0,0,1600,900);confetti.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});confetti=confetti.filter(p=>p.y<960);if(confetti.length)requestAnimationFrame(cstep);else{confOn=false;cx.clearRect(0,0,1600,900)}}

function drawCert(name){const c=document.createElement('canvas');c.width=1600;c.height=1130;const g=c.getContext('2d');
 g.fillStyle='#FFF8EA';g.fillRect(0,0,1600,1130);
 // sadu border
 for(let i=0;i<2;i++){g.fillStyle=i?'#2A1B12':'#9E3B32';}
 g.fillStyle='#9E3B32';g.fillRect(0,0,1600,70);g.fillRect(0,1060,1600,70);g.fillRect(0,0,70,1130);g.fillRect(1530,0,70,1130);
 g.fillStyle='#F5E6C8';const tri=(x,y,s,dir)=>{g.beginPath();g.moveTo(x,y);g.lineTo(x+s/2,y+dir*s*.7);g.lineTo(x+s,y);g.fill()};
 for(let x=0;x<1600;x+=50){tri(x,8,50,1);tri(x,1122,50,-1)}for(let y=70;y<1060;y+=50){g.beginPath();g.moveTo(8,y);g.lineTo(8+35,y+25);g.lineTo(8,y+50);g.fill();g.beginPath();g.moveTo(1592,y);g.lineTo(1557,y+25);g.lineTo(1592,y+50);g.fill()}
 g.strokeStyle='#F2BC58';g.lineWidth=8;g.strokeRect(100,100,1400,930);g.lineWidth=2;g.strokeRect(116,116,1368,898);
 // medal
 g.save();g.translate(800,240);g.fillStyle='#F2BC58';g.beginPath();for(let i=0;i<24;i++){const a=i/24*Math.PI*2,r=i%2?92:110;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.fill();g.fillStyle='#FFE29C';g.beginPath();g.arc(0,0,78,0,7);g.fill();
 g.fillStyle='#168B91';g.beginPath();g.roundRect?g.roundRect(-46,-40,92,64,26):g.rect(-46,-40,92,64);g.fill();g.fillStyle='#6FF3EC';g.beginPath();g.moveTo(-16,0);g.bezierCurveTo(-30,-10,-26,-26,-16,-20);g.bezierCurveTo(-6,-26,-2,-10,-16,0);g.fill();g.beginPath();g.moveTo(16,0);g.bezierCurveTo(2,-10,6,-26,16,-20);g.bezierCurveTo(26,-26,30,-10,16,0);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(0,46,12,0,7);g.fill();g.restore();
 g.textAlign='center';g.fillStyle='#4A2E1E';
 g.font='800 84px "Baloo Bhaijaan 2", sans-serif';g.fillText('OFFICIAL HERITAGE GUARDIAN',800,440);
 g.direction='rtl';g.font='800 64px "Baloo Bhaijaan 2", sans-serif';g.fillStyle='#B5822A';g.fillText('حارس التراث الرسمي',800,520);g.direction='ltr';
 g.fillStyle='#7B5036';g.font='600 36px "Baloo Bhaijaan 2", sans-serif';g.fillText('Awarded to · تُمنح إلى',800,600);
 g.fillStyle='#168B91';g.font='800 100px "Baloo Bhaijaan 2", sans-serif';g.fillText(name||'Heritage Hero',800,710);
 g.strokeStyle='#F2BC58';g.lineWidth=4;g.beginPath();g.moveTo(450,740);g.lineTo(1150,740);g.stroke();
 g.fillStyle='#4A2E1E';g.font='600 38px "Baloo Bhaijaan 2", sans-serif';g.fillText('For helping ROBO discover the heart of UAE heritage',800,810);
 g.direction='rtl';g.font='700 40px "Baloo Bhaijaan 2", sans-serif';g.fillText('لأنك ساعدت روبو يكتشف قلب التراث الإماراتي',800,870);g.direction='ltr';
 g.font='700 30px "Baloo Bhaijaan 2", sans-serif';g.fillStyle='#7B5036';g.fillText('Signed: Grandma Noor  ·  ROBO 2050  ·  '+NAMES.s1+' & '+NAMES.s2,800,950);
 g.font='600 26px "Baloo Bhaijaan 2", sans-serif';g.fillStyle='#B5822A';g.fillText('UAE Year of Family 2026 · عام الأسرة',800,995);
 return c.toDataURL('image/png')}
